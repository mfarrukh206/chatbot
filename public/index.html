<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#00a884" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ChatApp" />
  <title>ChatApp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300a884'/%3E%3Cpath d='M18 18h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H33l-9 8v-8h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-check2" viewBox="0 0 24 24"><path d="m1.5 13 4 4L15 7"/><path d="m9.5 15.5 1.5 1.5L21 7"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
</svg>

<!-- Splash (auto-login ke waqt) -->
<div id="splash" class="splash hidden">
  <div class="spinner big"></div>
  <p>Connecting…</p>
</div>

<!-- Login -->
<div id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#00a884"/>
        <path d="M18 18h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H33l-9 8v-8h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z" fill="#fff"/>
        <circle cx="25" cy="31" r="2.4" fill="#00a884"/><circle cx="32" cy="31" r="2.4" fill="#00a884"/><circle cx="39" cy="31" r="2.4" fill="#00a884"/>
      </svg>
    </div>
    <h1>ChatApp</h1>
    <p class="lead">Apna naam likhein aur sab ke saath chat shuru karein</p>
    <label class="field">
      <span>Aapka naam</span>
      <input id="nameInput" type="text" maxlength="20" placeholder="Jaise: Ali" autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="go" />
    </label>
    <button id="loginBtn" type="submit" class="primary"><span class="label">Join Karein</span><span class="spinner small"></span></button>
    <div id="loginError" class="error" role="alert"></div>
    <p class="fine">Ye naam baaqi sab ko dikhega.</p>
  </form>
</div>

<!-- App -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <header class="side-head">
      <div class="avatar" id="meAvatar"></div>
      <div class="me">
        <div class="me-name" id="meName"></div>
        <div class="me-status" id="connState"><span class="dot"></span><span id="connText">online</span></div>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Theme badlein"></button>
      <button id="logoutBtn" class="icon-btn" type="button" aria-label="Logout"><svg class="ic"><use href="#i-logout"/></svg></button>
    </header>
    <div class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="Naam se dhoondhein" autocomplete="off" enterkeyhint="search" />
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="chat" id="chatMain">
    <div id="empty" class="empty">
      <div class="empty-ic"><svg class="ic"><use href="#i-chat"/></svg></div>
      <h2>ChatApp</h2>
      <p>Chat shuru karne ke liye list mein se kisi ko chunein.</p>
    </div>

    <section id="chatPane" class="chat-pane hidden">
      <header class="chat-head">
        <button id="backBtn" class="icon-btn back" type="button" aria-label="Wapas"><svg class="ic"><use href="#i-back"/></svg></button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="chat-title">
          <div id="chatName" class="name"></div>
          <div id="chatSub" class="sub"></div>
        </div>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <button id="toBottom" class="to-bottom hidden" type="button" aria-label="Neeche jaein">
        <span id="toBottomCount" class="count hidden"></span>
        <svg class="ic"><use href="#i-down"/></svg>
      </button>

      <div class="bottom">
        <div id="attachMenu" class="pop hidden" role="menu">
          <button type="button" data-pick="gallery" role="menuitem"><span class="pi gallery"><svg class="ic"><use href="#i-image"/></svg></span>Photo / Video</button>
          <button type="button" data-pick="camera" role="menuitem" id="cameraItem"><span class="pi camera"><svg class="ic"><use href="#i-camera"/></svg></span>Camera</button>
          <button type="button" data-pick="doc" role="menuitem"><span class="pi doc"><svg class="ic"><use href="#i-file"/></svg></span>Document</button>
        </div>

        <div id="emojiPanel" class="emoji hidden">
          <div id="emojiTabs" class="emoji-tabs"></div>
          <div id="emojiGrid" class="emoji-grid"></div>
        </div>

        <div id="recBar" class="rec hidden">
          <button id="recCancel" class="icon-btn danger" type="button" aria-label="Recording cancel karein"><svg class="ic"><use href="#i-trash"/></svg></button>
          <span class="rec-dot"></span>
          <span id="recTime" class="rec-time">0:00</span>
          <div id="recBars" class="rec-bars" aria-hidden="true"></div>
          <button id="recSend" class="send-btn" type="button" aria-label="Voice message bhejein"><svg class="ic"><use href="#i-send"/></svg></button>
        </div>

        <div id="composer" class="composer">
          <button id="emojiBtn" class="icon-btn" type="button" aria-label="Emoji"><svg class="ic"><use href="#i-smile"/></svg></button>
          <button id="attachBtn" class="icon-btn" type="button" aria-label="File bhejein"><svg class="ic"><use href="#i-clip"/></svg></button>
          <textarea id="msgInput" rows="1" placeholder="Message likhein" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" maxlength="2000"></textarea>
          <button id="micBtn" class="send-btn" type="button" aria-label="Voice message"><svg class="ic"><use href="#i-mic"/></svg></button>
          <button id="sendBtn" class="send-btn hidden" type="button" aria-label="Bhejein"><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
      </div>
    </section>
  </main>
</div>

<input id="fileGallery" type="file" accept="image/*,video/*" hidden />
<input id="fileCamera" type="file" accept="image/*" capture="environment" hidden />
<input id="fileDoc" type="file" hidden />

<!-- Send preview -->
<div id="preview" class="modal hidden" role="dialog" aria-modal="true" aria-label="Bhejne se pehle dekhein">
  <div class="modal-card">
    <header class="modal-head">
      <button id="pvClose" class="icon-btn" type="button" aria-label="Band karein"><svg class="ic"><use href="#i-x"/></svg></button>
      <div id="pvTitle" class="modal-title"></div>
    </header>
    <div id="pvBody" class="pv-body"></div>
    <div id="pvProgress" class="progress hidden"><div id="pvBar"></div></div>
    <footer class="pv-foot">
      <input id="pvCaption" type="text" placeholder="Caption likhein (optional)" maxlength="500" autocomplete="off" enterkeyhint="send" />
      <button id="pvSend" class="send-btn" type="button" aria-label="Bhejein"><svg class="ic"><use href="#i-send"/></svg></button>
    </footer>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lb-bar">
    <button id="lbClose" class="icon-btn light" type="button" aria-label="Band karein"><svg class="ic"><use href="#i-x"/></svg></button>
    <span class="grow"></span>
    <a id="lbDownload" class="icon-btn light" aria-label="Download" download><svg class="ic"><use href="#i-download"/></svg></a>
  </div>
  <img id="lbImg" alt="" />
</div>

<!-- Action sheet -->
<div id="sheet" class="sheet-wrap hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="sheetTitle" class="sheet-title"></div>
    <div id="sheetActions" class="sheet-actions"></div>
  </div>
</div>

<div id="drop" class="drop hidden"><div>File yahan chhorein</div></div>
<div id="connBanner" class="conn-banner hidden" role="status"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
